name: Checks

# Runs the tests and the type check on every PR and on pushes to main. Read-only token, no
# secrets. The only action is GitHub's own checkout, pinned to a commit. Bun comes from npm at a
# pinned version instead of a setup action; that package's install script still runs here, so
# the pin, not this file, is what limits it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Bun
        run: npm install --global bun@1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Tests
        run: bun test
